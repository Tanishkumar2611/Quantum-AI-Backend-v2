openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: QuantumAI-Backend — minimal Gemini chat API
servers:
  - url: /api
    description: Base API path
tags:
  - name: chat
    description: Chat endpoint

paths:
  /chat:
    post:
      operationId: chat
      tags: [chat]
      summary: Send a message
      description: Send a message and receive a reply from Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Gemini reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gemini error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate-image:
    post:
      operationId: generateImage
      tags: [chat]
      summary: Generate an image
      description: Generate an image from a text prompt using Gemini image generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageRequest"
      responses:
        "200":
          description: Generated image as base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Gemini error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required:
        - message

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
      required:
        - reply

    GenerateImageRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
      required:
        - prompt

    GenerateImageResponse:
      type: object
      properties:
        b64_json:
          type: string
        mimeType:
          type: string
      required:
        - b64_json
        - mimeType

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
